<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Native mobile developer banner</title>
  <desc id="description">Midnight-blue banner with Swift, Kotlin, Android, and Wear OS, alongside abstract phone and watch outlines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061326" />
      <stop offset="0.55" stop-color="#0A1D38" />
      <stop offset="1" stop-color="#102C4C" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42A5F5" stop-opacity="0.36" />
      <stop offset="1" stop-color="#42A5F5" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9ACBFF" stroke-opacity="0.055" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32" />
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)" />
  <rect width="1200" height="300" rx="24" fill="url(#grid)" />
  <circle cx="1000" cy="72" r="180" fill="url(#glow)" filter="url(#softGlow)" />
  <path d="M0 250C240 210 370 318 625 263s350-109 575-42v79H0Z" fill="#102B49" fill-opacity="0.52" />
  <path d="M0 268c240-40 370 58 625 3s350-109 575-42" fill="none" stroke="#4DA8FF" stroke-opacity="0.22" stroke-width="2" />

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <text x="72" y="95" fill="#83C7FF" font-size="15" font-weight="700" letter-spacing="4">NATIVE MOBILE DEVELOPER</text>
    <text x="68" y="158" fill="#F1F7FF" font-size="48" font-weight="700" letter-spacing="-1">Swift <tspan fill="#60B8FF">·</tspan> Kotlin</text>
    <text x="72" y="196" fill="#B5C9E2" font-size="18" font-weight="500" letter-spacing="1">iOS  ·  Android  ·  Wear OS</text>
    <rect x="72" y="224" width="116" height="4" rx="2" fill="#55B8FF" />
    <circle cx="203" cy="226" r="3" fill="#55B8FF" fill-opacity="0.6" />
    <circle cx="216" cy="226" r="3" fill="#55B8FF" fill-opacity="0.34" />
  </g>

  <g fill="none" stroke="#8CCBFF" stroke-linecap="round" stroke-linejoin="round">
    <rect x="838" y="36" width="166" height="228" rx="27" fill="#0A1A31" fill-opacity="0.72" stroke-opacity="0.72" stroke-width="2" />
    <rect x="851" y="52" width="140" height="195" rx="17" fill="#0D2441" stroke-opacity="0.34" />
    <path d="M894 43h54" stroke-opacity="0.5" stroke-width="3" />
    <circle cx="921" cy="232" r="5" stroke-opacity="0.6" />
    <path d="M873 91h96M873 105h62" stroke-opacity="0.38" stroke-width="3" />
    <rect x="873" y="128" width="96" height="53" rx="10" fill="#15395F" stroke-opacity="0.44" />
    <path d="M885 153h23l9-12 11 22 8-10h21" stroke="#5CB8FF" stroke-opacity="0.92" stroke-width="3" />
    <rect x="873" y="194" width="43" height="30" rx="8" fill="#173B60" stroke-opacity="0.42" />
    <rect x="926" y="194" width="43" height="30" rx="8" fill="#173B60" stroke-opacity="0.42" />

    <path d="M1063 81c0-14 11-25 25-25h22c14 0 25 11 25 25v22h-72Z" fill="#153453" stroke-opacity="0.64" stroke-width="2" />
    <rect x="1052" y="98" width="94" height="116" rx="36" fill="#0A1A31" stroke-opacity="0.84" stroke-width="2" />
    <path d="M1063 210v21c0 14 11 25 25 25h22c14 0 25-11 25-25v-21" fill="#153453" stroke-opacity="0.64" stroke-width="2" />
    <circle cx="1099" cy="156" r="26" stroke="#5CB8FF" stroke-opacity="0.92" stroke-width="3" />
    <path d="M1099 140v17l12 8" stroke="#5CB8FF" stroke-opacity="0.92" stroke-width="3" />
  </g>

  <circle cx="785" cy="80" r="3" fill="#8CCBFF" fill-opacity="0.75" />
  <circle cx="1152" cy="64" r="4" fill="#8CCBFF" fill-opacity="0.8" />
  <circle cx="1165" cy="236" r="3" fill="#8CCBFF" fill-opacity="0.6" />
</svg>
