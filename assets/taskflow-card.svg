<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow team task manager</title>
  <desc id="desc">A Jira-style team task manager with Spring Boot, PostgreSQL, Google sign-in and a React TypeScript interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07162B" />
      <stop offset="1" stop-color="#102E52" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69D5FF" />
      <stop offset="1" stop-color="#9A8CFF" />
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0v22" fill="none" stroke="#B6DEFF" stroke-opacity=".045" />
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#020813" flood-opacity=".4" />
    </filter>
  </defs>
  <rect width="600" height="330" rx="24" fill="url(#bg)" />
  <rect width="600" height="330" rx="24" fill="url(#grid)" />
  <rect x="1" y="1" width="598" height="328" rx="23" fill="none" stroke="#68B8F0" stroke-opacity=".35" />
  <circle cx="108" cy="284" r="139" fill="#6948BD" opacity=".11" />
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
