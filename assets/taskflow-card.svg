    <circle cx="43" cy="39.5" r="3.2" fill="#A69BFF" />
    <text x="54" y="44" fill="#D6DCFF" font-size="10" font-weight="700" letter-spacing="1.1">02  /  FULL STACK</text>
    <text x="28" y="112" fill="#F2F8FF" font-size="48" font-weight="700" letter-spacing="-1.7">TaskFlow</text>
    <text x="31" y="141" fill="#AEB8F0" font-size="13" font-weight="700" letter-spacing="1.8">A BOARD FOR THE WHOLE TEAM</text>
    <text x="31" y="180" fill="#D4E6F5" font-size="14">Tasks, ownership and progress</text>
    <text x="31" y="201" fill="#D4E6F5" font-size="14">in one full-stack workflow.</text>
    <g transform="translate(30 240)">
      <rect width="106" height="27" rx="13.5" fill="#0A1B30" stroke="#8E9AFF" stroke-opacity=".62" />
      <text x="53" y="18" text-anchor="middle" fill="#E0E3FF" font-size="10" font-weight="600" letter-spacing=".5">SPRING BOOT</text>
      <rect x="114" width="78" height="27" rx="13.5" fill="#0A1B30" stroke="#8E9AFF" stroke-opacity=".62" />
      <text x="153" y="18" text-anchor="middle" fill="#E0E3FF" font-size="10" font-weight="600" letter-spacing=".5">REACT</text>
      <rect x="200" width="99" height="27" rx="13.5" fill="#0A1B30" stroke="#8E9AFF" stroke-opacity=".62" />
      <text x="249.5" y="18" text-anchor="middle" fill="#E0E3FF" font-size="10" font-weight="600" letter-spacing=".5">TYPESCRIPT</text>
